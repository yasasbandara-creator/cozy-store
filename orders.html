<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | cozy.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #faf8f1;
    --white: #fff;
    --green: #718b68;
    --green-light: #e7f0e2;
    --text: #384548;
    --muted: #788386;
    --border: rgba(56,69,72,.12);
    --shadow: 0 15px 40px rgba(57,69,72,.07);
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: var(--cream);
    color: var(--text);
    font-family: "Quicksand", sans-serif;
    line-height: 1.6;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
.header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(250,248,241,.94);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
}
.nav {
    max-width: 1120px;
    min-height: 72px;
    padding: 12px 22px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}
.logo {
    font: 600 29px "Fredoka", sans-serif;
    letter-spacing: -1px;
}
.logo span { color: var(--green); }
.nav-links {
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
}
.nav-links a:hover { color: var(--green); }
.container {
    max-width: 1000px;
    width: calc(100% - 36px);
    margin: 42px auto 70px;
}
.eyebrow {
    color: var(--green);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
}
h1 {
    font: 600 clamp(30px,5vw,44px) "Fredoka", sans-serif;
    margin: 5px 0;
}
.subtitle { color: var(--muted); margin-top: 4px; }
.toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 24px 0;
}
.toolbar input, .toolbar select {
    min-height: 44px;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 10px 13px;
    background: white;
    color: var(--text);
    font: inherit;
}
.toolbar input { flex: 1; min-width: 180px; }
.toolbar select { max-width: 100%; }
.order-list {
    display: grid;
    gap: 18px;
}
.order-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
}
.order-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}
.order-number {
    font: 600 19px "Fredoka", sans-serif;
    overflow-wrap: anywhere;
}
.order-date { color: var(--muted); font-size: 12px; }
.status {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 100px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    background: #fff1d9;
    color: #94621d;
    height: fit-content;
}
.status.processing { background: #e9e6ff; color: #6250a0; }
.status.shipped { background: #e0f0ff; color: #276c9c; }
.status.delivered { background: #e1f3e4; color: #347348; }
.status.cancelled { background: #ffe5e5; color: #a23c3c; }
.items { display: grid; gap: 12px; padding: 17px 0; }
.item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    font-size: 13px;
}
.item-name { font-weight: 700; overflow-wrap: anywhere; }
.item-meta { color: var(--muted); font-size: 12px; }
.item-price { font-weight: 700; white-space: nowrap; }
.order-bottom {
    border-top: 1px solid var(--border);
    padding-top: 16px;
}
.total-line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
}
.total-line strong {
    font: 600 23px "Fredoka", sans-serif;
}
.payment { color: var(--muted); font-size: 12px; margin-top: 4px; }
.track-title { margin: 22px 0 12px; font-size: 12px; font-weight: 700; }
.tracking {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 5px;
}
.track-step { text-align: center; color: #a1a9a8; font-size: 10px; }
.track-dot {
    width: 22px;
    height: 22px;
    margin: 0 auto 7px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #e9eae6;
    color: #778078;
    font-size: 11px;
}
.track-step.done { color: var(--green); font-weight: 700; }
.track-step.done .track-dot { background: var(--green-light); color: var(--green); }
.track-step.current .track-dot { background: var(--green); color: white; }
.cancel-note {
    margin-top: 12px;
    padding: 10px 12px;
    background: #fff0f0;
    color: #a23c3c;
    border-radius: 10px;
    font-size: 12px;
}
.empty {
    text-align: center;
    padding: 48px 20px;
    border-radius: 22px;
    background: white;
    border: 1px dashed #cfd8ca;
}
.empty-icon { font-size: 43px; }
.empty h2 { font: 600 24px "Fredoka", sans-serif; margin: 10px 0 4px; }
.empty p { color: var(--muted); font-size: 13px; }
.btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    padding: 12px 18px;
    border-radius: 13px;
    background: var(--green);
    color: white;
    border: 0;
    font-size: 13px;
    font-weight: 700;
    margin-top: 12px;
}
.btn:hover { filter: brightness(.95); }
.notice {
    background: #fff6df;
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 18px;
    font-size: 12px;
    color: #785e2d;
}
.footer {
    text-align: center;
    padding: 25px 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
}
[hidden] { display: none !important; }

@media (max-width: 600px) {
    .nav { padding: 12px 16px; min-height: 64px; }
    .logo { font-size: 25px; }
    .nav-links { gap: 12px; font-size: 12px; }
    .container { width: calc(100% - 24px); margin-top: 28px; }
    .order-card { padding: 16px; border-radius: 17px; }
    .tracking { gap: 2px; }
    .track-step { font-size: 9px; }
    .track-dot { width: 20px; height: 20px; }
}
</style>
</head>

<body>
<header class="header">
    <nav class="nav">
        <a class="logo" href="index.html">cozy<span>.</span></a>
        <div class="nav-links">
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>
            <a href="account.html">Account</a>
        </div>
    </nav>
</header>

<main class="container">
    <div class="eyebrow">Your cozy corner ♡</div>
    <h1>My Orders</h1>
    <p class="subtitle">Keep track of your little happy purchases.</p>

    <div id="notice" class="notice" hidden></div>

    <div class="toolbar" id="toolbar" hidden>
        <input id="searchOrder" type="search" placeholder="Search by order number..." aria-label="Search orders">
        <select id="statusFilter" aria-label="Filter orders by status">
            <option value="all">All statuses</option>
            <option value="Pending">Pending</option>
            <option value="Processing">Processing</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
        </select>
    </div>

    <div id="orderList" class="order-list" aria-live="polite"></div>
</main>

<footer class="footer">Made with ♡ for your everyday little joys.</footer>

<script>
(() => {
    "use strict";

    const ORDERS_KEY = "cozy_store_orders";
    const SESSION_KEY = "cozy_customer_session_demo_v1";

    const list = document.getElementById("orderList");
    const toolbar = document.getElementById("toolbar");
    const notice = document.getElementById("notice");
    const search = document.getElementById("searchOrder");
    const statusFilter = document.getElementById("statusFilter");

    function readOrders() {
        try {
            const value = JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]");
            return Array.isArray(value) ? value : [];
        } catch {
            return [];
        }
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    function money(value) {
        return "Rs. " + (Number(value) || 0).toLocaleString("en-LK", {
            maximumFractionDigits: 2
        });
    }

    function formatDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "Date unavailable";
        return date.toLocaleString("en-LK", {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function getStatus(order) {
        const allowed = ["Pending", "Processing", "Shipped", "Delivered", "Cancelled"];
        return allowed.includes(order.status) ? order.status : "Pending";
    }

    function statusClass(status) {
        return status.toLowerCase();
    }

    function trackingHTML(status) {
        if (status === "Cancelled") {
            return '<div class="cancel-note">This order has been cancelled.</div>';
        }

        const stages = ["Pending", "Processing", "Shipped", "Delivered"];
        const currentIndex = stages.indexOf(status);

        return `
            <div class="track-title">ORDER PROGRESS</div>
            <div class="tracking">
                ${stages.map((stage, index) => {
                    const done = index < currentIndex;
                    const current = index === currentIndex;
                    return `
                        <div class="track-step ${done ? "done" : ""} ${current ? "current" : ""}">
                            <div class="track-dot">${done ? "✓" : index + 1}</div>
                            ${stage}
                        </div>
                    `;
                }).join("")}
            </div>
        `;
    }

    function renderOrder(order) {
        const number = order.orderNumber || order.id || "COZY-ORDER";
        const status = getStatus(order);
        const items = Array.isArray(order.items) ? order.items : [];

        const itemsHTML = items.map(item => {
            const name = item.name || item.title || "Product";
            const quantity = Math.max(1, Number(item.quantity) || 1);
            const price = Number(item.price) || 0;

            return `
                <div class="item">
                    <div>
                        <div class="item-name">${escapeHTML(name)}</div>
                        <div class="item-meta">Quantity: ${quantity}</div>
                    </div>
                    <div class="item-price">${money(price * quantity)}</div>
                </div>
            `;
        }).join("");

        const subtotal = Number(order.subtotal) || 0;
        const delivery = Number(order.delivery) || 0;
        const total = order.total != null
            ? Number(order.total) || 0
            : subtotal + delivery;

        return `
            <article class="order-card">
                <div class="order-top">
                    <div>
                        <div class="order-number">${escapeHTML(number)}</div>
                        <div class="order-date">${escapeHTML(formatDate(order.date))}</div>
                    </div>
                    <span class="status ${statusClass(status)}">${escapeHTML(status)}</span>
                </div>

                <div class="items">
                    ${itemsHTML || '<p class="item-meta">No item details are available for this order.</p>'}
                </div>

                <div class="order-bottom">
                    <div class="total-line">
                        <span>Order total</span>
                        <strong>${money(total)}</strong>
                    </div>
                    <div class="payment">
                        Payment: ${escapeHTML(
                            order.paymentMethod === "cash" ? "Cash on Delivery" :
                            order.paymentMethod === "bank" ? "Bank Transfer" :
                            order.paymentMethod || "Not specified"
                        )}
                    </div>
                    ${trackingHTML(status)}
                </div>
            </article>
        `;
    }

    function showMessage(title, message, buttonText, buttonURL) {
        list.innerHTML = `
            <div class="empty">
                <div class="empty-icon">♡</div>
                <h2>${escapeHTML(title)}</h2>
                <p>${escapeHTML(message)}</p>
                <a class="btn" href="${buttonURL}">${escapeHTML(buttonText)}</a>
            </div>
        `;
    }

    function render() {
        let email = "";
        try {
            email = (localStorage.getItem(SESSION_KEY) || "").trim().toLowerCase();
        } catch {}

        if (!email) {
            toolbar.hidden = true;
            showMessage(
                "Sign in to see your orders",
                "Please sign in to the customer account you used when placing your orders.",
                "Go to Account",
                "account.html"
            );
            return;
        }

        const allOrders = readOrders();

        // Only show orders matching the signed-in account's email.
        const customerOrders = allOrders
            .filter(order =>
                String(order.customer?.email || "").trim().toLowerCase() === email
            )
            .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        const query = search.value.trim().toLowerCase();
        const chosenStatus = statusFilter.value;

        const filtered = customerOrders.filter(order => {
            const number = String(order.orderNumber || order.id || "").toLowerCase();
            return number.includes(query) &&
                (chosenStatus === "all" || getStatus(order) === chosenStatus);
        });

        toolbar.hidden = customerOrders.length === 0;

        if (customerOrders.length === 0) {
            showMessage(
                "No orders yet",
                "Your next favourite find is waiting for you.",
                "Explore the Shop",
                "shop.html"
            );
            return;
        }

        if (filtered.length === 0) {
            showMessage(
                "No matching orders",
                "Try another order number or choose a different status.",
                "Clear filters",
                "orders.html"
            );
            return;
        }

        list.innerHTML = filtered.map(renderOrder).join("");
    }

    search.addEventListener("input", render);
    statusFilter.addEventListener("change", render);

    // Re-read order statuses whenever the page becomes visible again.
    window.addEventListener("focus", render);
    window.addEventListener("storage", event => {
        if (event.key === ORDERS_KEY || event.key === SESSION_KEY) render();
    });

    render();
})();
</script>
</body>
</html>
